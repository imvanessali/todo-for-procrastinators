  <section class="features">
    <div class="feature">
      <div class="icon">📋</div>
      <h3>今天 / 明天，一目了然</h3>
      <p>左边只放今天，右边只放明天。不用面对整张清单的压迫感，一次只看两天。</p>
    </div>
    <div class="feature">
      <div class="icon">🌙</div>
      <h3>没做完？明天再说</h3>
      <p>今天结束，没完成的自动移到明天最上面。拖延很正常，任务不会消失。</p>
    </div>
    <div class="feature">
      <div class="icon">📊</div>
      <h3>搜索与甘特图</h3>
      <p>随时搜索任意任务。甘特图帮你看清每件事真正花了多久——包括"明天再说"的那些天。</p>

  <!-- 登录态感知：已登录则导航显示账号名 + 进入入口 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js?v=12"></script>
  <script src="assets/auth.js?v=12"></script>
  <script>
    (async () => {
      let session;
      try { session = await FolioAuth.getSession(); } catch { return; }
      if (!session) return;
      const email = session.user.email || '已登录';
      const actions = document.getElementById('nav-actions');
      actions.innerHTML =
        '<span class="nav-user" title="' + email + '">' + email + '</span>' +
        '<a class="nav-link" id="nav-logout" href="#">退出</a>' +
        '<a class="nav-cta" href="app.html">打开我的 Todo →</a>';
      document.getElementById('nav-logout').onclick = (e) => { e.preventDefault(); FolioAuth.signOut(); };
      const heroCta = document.getElementById('hero-cta');
      if (heroCta) heroCta.textContent = '打开我的 Todo →';
    })();
  </script>
