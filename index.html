  <script>
    (async () => {
      let session;
      try { session = await FolioAuth.getSession(); } catch { return; }
      if (!session) return;
      const email = session.user.email || '已登录';
      const initial = ((email || '').trim()[0] || '?').toUpperCase();
      const actions = document.getElementById('nav-actions');
      const ARROW = '<svg class="cta-arrow" viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M23.73,11.356l-5.154-5.087c-.581-.574-1.575-.167-1.575,.644v3.587H1.5c-.828,0-1.5,.671-1.5,1.5s.672,1.5,1.5,1.5h15.5v3.587c0,.811,.994,1.218,1.575,.644l5.154-5.087c.36-.356,.36-.932,0-1.288Z"/></svg>';
      actions.innerHTML =
        '<a class="nav-cta" href="app.html">开始记录 ' + ARROW + '</a>' +
        '<div class="user-menu" id="nav-user-menu">' +
          '<button class="avatar" id="nav-avatar"></button>' +
          '<div class="user-pop hidden" id="nav-pop">' +
            '<div class="user-pop-email"></div>' +
            '<button class="user-pop-logout" id="nav-logout">退出</button>' +
          '</div>' +
        '</div>';
      document.getElementById('nav-avatar').textContent = initial;
      actions.querySelector('.user-pop-email').textContent = email;
      const navAvatar = document.getElementById('nav-avatar');
      const navPop = document.getElementById('nav-pop');
      navAvatar.onclick = (e) => { e.stopPropagation(); navPop.classList.toggle('hidden'); };
      document.getElementById('nav-logout').onclick = (e) => { e.preventDefault(); FolioAuth.signOut(); };
      document.addEventListener('click', (e) => { if (!document.getElementById('nav-user-menu').contains(e.target)) navPop.classList.add('hidden'); });
    })();
  </script>
  <script>
    // hero 预览轮播：自动滑动 / 圆点指示（悬停或交互时暂停）
    (() => {
      const track = document.getElementById('carousel-track');
      if (!track) return;
      const wrap = document.getElementById('hero-carousel');
      const slides = track.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('#carousel-dots .dot');
      const current = () => Math.round(track.scrollLeft / track.clientWidth);
      let timer, snapTimer;
      const goTo = (i) => {
        track.style.scrollSnapType = 'none';        // 避免 proximity 把程序滚动吸附回起点
        track.scrollLeft = track.clientWidth * i;   // 平滑过渡由 CSS scroll-behavior 提供
        clearTimeout(snapTimer);
        snapTimer = setTimeout(() => { track.style.scrollSnapType = ''; }, 600);
      };
      const start = () => { timer = setInterval(() => goTo((current() + 1) % slides.length), 4000); };
      const stop = () => clearInterval(timer);
      const restart = () => { stop(); start(); };
      dots.forEach((d) => d.addEventListener('click', () => { goTo(+d.dataset.i); restart(); }));
      document.getElementById('carousel-prev').addEventListener('click', () => { goTo((current() - 1 + slides.length) % slides.length); restart(); });
      document.getElementById('carousel-next').addEventListener('click', () => { goTo((current() + 1) % slides.length); restart(); });
      track.addEventListener('scroll', () => {
        dots.forEach((d, k) => d.classList.toggle('active', k === current()));
      }, { passive: true });
      track.addEventListener('pointerdown', restart);
      wrap.addEventListener('mouseenter', stop);
      wrap.addEventListener('mouseleave', start);
      start();
    })();
