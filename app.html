<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Today or Not Today – 今天与改天</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M33 5 C46 4 59 15 58 31 C57 47 47 59 31 58 C16 57 5 47 6 30 C7 15 19 6 33 5 Z' fill='%23f4c340'/><circle cx='24' cy='27' r='2.4' fill='%2352565e'/><circle cx='40' cy='27' r='2.4' fill='%2352565e'/><path d='M25 38 Q32 43 39 38' fill='none' stroke='%2352565e' stroke-width='2.6' stroke-linecap='round'/></svg>">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('folio.theme')||'mooda'}catch(e){document.documentElement.dataset.theme='mooda'}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=78">
</head>
<body>
  <header class="topbar">
    <a class="logo" href=".">
      <svg width="24" height="24" viewBox="0 0 64 64"><path d="M33 5 C46 4 59 15 58 31 C57 47 47 59 31 58 C16 57 5 47 6 30 C7 15 19 6 33 5 Z" fill="#f4c340"/><circle cx="24" cy="27" r="2.4" fill="#52565e"/><circle cx="40" cy="27" r="2.4" fill="#52565e"/><path d="M25 38 Q32 43 39 38" fill="none" stroke="#52565e" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span class="logo-text">Today or Not Today</span>
    </a>
    <nav class="view-toggle" id="view-toggle">
      <button data-view="notebook" class="active">Todo</button>
      <button data-view="gantt">甘特图</button>
    </nav>
    <div class="spacer"></div>
    <button class="theme-toggle" id="theme-toggle" title="切换主题"></button>
    <div class="search-wrap" id="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="search-input" type="text" placeholder="搜索" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
<div class="user-menu" id="user-menu"></div>
  </header>

  <!-- 登录 -->
  <main class="login-wrap hidden" id="login-view">
    <div class="login-card">
      <div class="login-brand">
        <svg width="40" height="40" viewBox="0 0 64 64"><path d="M33 5 C46 4 59 15 58 31 C57 47 47 59 31 58 C16 57 5 47 6 30 C7 15 19 6 33 5 Z" fill="#f4c340"/><circle cx="24" cy="27" r="2.4" fill="#52565e"/><circle cx="40" cy="27" r="2.4" fill="#52565e"/><path d="M25 38 Q32 43 39 38" fill="none" stroke="#52565e" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span class="login-brand-name">Today or Not Today</span>
      </div>
      <p class="sub">登录后，你的任务会安全保存在云端。</p>
      <button class="btn" id="btn-google">
        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
        使用 Google 登录
      </button>
      <div class="login-divider">或使用邮箱验证码</div>
      <form id="otp-form">
        <input class="field" id="otp-email" type="email" placeholder="邮箱地址" required>
        <input class="field hidden" id="otp-code" type="text" inputmode="numeric" placeholder="6 位验证码" autocomplete="one-time-code">
        <button class="btn btn-primary" id="otp-submit" type="submit">发送验证码</button>
      </form>
      <p class="login-msg" id="login-msg"></p>
    </div>
  </main>

  <!-- 笔记本视图 -->
  <main class="notebook-wrap hidden" id="notebook-view">
    <div class="book">
      <section class="page left">
        <header class="page-header">
          <span class="mood-face" id="today-face"></span>
          <div class="ph-text">
            <div class="page-label">Today · 今天</div>
            <div class="page-count" id="today-count"></div>
          </div>
          <button class="journal-btn" id="journal-btn" title="随手写点">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="m14.269,6.481L20.103.673c.953-.953,2.534-.894,3.409.176.761.93.598,2.317-.252,3.167l-5.741,5.715c-.813.813-1.915,1.269-3.064,1.269h-.955c-.276,0-.5-.224-.5-.5v-.955c0-1.149.457-2.252,1.269-3.064Zm9.731,13.019v.5c0,2.206-1.794,4-4,4h-11c-2.206,0-4-1.794-4-4v-12h-1.5c-1.93,0-3.5-1.57-3.5-3.5v-.5C0,1.898,1.635.158,3.697,0h10.803c.828,0,1.5.672,1.5,1.5s-.672,1.5-1.5,1.5h-6.642c.084.322.142.653.142,1v16c0,.552.448,1,1,1s1-.448,1-1v-.5c0-1.93,1.57-3.5,3.5-3.5h3.5v-2.5c0-.828.672-1.5,1.5-1.5s1.5.672,1.5,1.5v2.5h.5c1.93,0,3.5,1.57,3.5,3.5ZM5,4c0-.552-.448-1-1-1s-1,.448-1,1v.5c0,.275.225.5.5.5h1.5v-1Zm16,15.5c0-.275-.225-.5-.5-.5h-7c-.275,0-.5.225-.5.5v.5c0,.345-.044.681-.127,1h7.127c.552,0,1-.448,1-1v-.5Z"/></svg>
          </button>
        </header>
        <ul class="todo-list" id="today-list"></ul>
        <form class="todo-add" id="today-add-form">
          <span class="plus">+</span>
          <input id="today-add" type="text" enterkeyhint="done" placeholder="添加今天的任务">
        </form>
      </section>
      <section class="page right">
        <header class="page-header">
          <span class="mood-face" id="tomorrow-face"></span>
          <div class="ph-text">
            <div class="page-label">Not Today · 改天</div>
            <div class="page-count" id="tomorrow-count"></div>
          </div>
        </header>
        <ul class="todo-list" id="tomorrow-list"></ul>
        <form class="todo-add" id="tomorrow-add-form">
          <span class="plus">+</span>
          <input id="tomorrow-add" type="text" enterkeyhint="done" placeholder="添加改天的任务">
        </form>
      </section>
    </div>
  </main>

  <!-- 甘特图视图 -->
  <main class="gantt-wrap hidden" id="gantt-view">
    <div class="gantt-toolbar">
      <h2 id="gantt-month"></h2>
      <button id="gantt-prev">‹</button>
      <button id="gantt-today">今天</button>
      <button id="gantt-next">›</button>
      <div class="gantt-sort-group" id="gantt-sort-group">
        <button data-gsort="created" class="active">创建时间</button>
        <button data-gsort="duration">持续时间</button>
      </div>
    </div>
    <div class="gantt" id="gantt-container"></div>
  </main>

  <!-- 日记 -->
  <div class="journal-modal hidden" id="journal-modal">
    <div class="journal-card">
      <div class="journal-head">
        <span class="journal-title" id="journal-title">日记</span>
        <button class="journal-close" id="journal-close" title="关闭">×</button>
      </div>
      <textarea class="journal-text" id="journal-text" placeholder="写点什么……"></textarea>
      <div class="journal-foot">
        <span class="journal-status" id="journal-status"></span>
        <button class="btn btn-primary" id="journal-save" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="assets/config.js?v=78"></script>
  <script src="assets/auth.js?v=78"></script>
  <script src="assets/store.js?v=78"></script>
  <script src="assets/app.js?v=78"></script>
</body>
</html>
